name: tests

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: CPU offline tests (pytest + wrapper)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            container/constraints.txt
            container/requirements-agent.txt

      - name: Install CPU runtime, agent, and test dependencies
        run: |
          python -m pip install "pip==25.2"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0"
          python -m pip install -c container/constraints.txt \
            numpy cftime netCDF4 h5netcdf xarray pyyaml pytest huggingface_hub scipy pandas matplotlib \
            -r container/requirements-agent.txt
          # optional model packages the phase-2c tests import (pins as in container/constraints-emu.txt)
          python -m pip install "zarr==3.3.0" "omegaconf==2.3.1"
          python -m pip install --no-deps -e .

      - name: Run pytest suite (offline, CPU-only)
        env:
          HF_HUB_OFFLINE: "1"
          TMPDIR: /tmp
        run: |
          umask 022
          python -m pytest -q -p no:cacheprovider tests

      - name: Run wrapper shell tests
        env:
          TMPDIR: /tmp
        run: |
          umask 022
          bash tests/wrapper/test_wrapper.sh

      - name: Run end-to-end console session demo
        env:
          TMPDIR: /tmp
        run: |
          umask 022
          bash tests/console_session.sh

      - name: Run end-to-end UI session demo
        env:
          TMPDIR: /tmp
        run: |
          umask 022
          bash tests/ui_session.sh
